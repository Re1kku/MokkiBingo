<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mökkibingo - Vain Kirjautuminen</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2e7d32; --bg: #f4f7f6; --card-bg: #ffffff; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { text-align: center; color: var(--primary); margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-secondary { background-color: #f5f5f5; color: #333; border: 1px solid #ccc; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="login-view" class="view active card">
        <h1>🌲 Kirjaudu</h1>
        <input type="email" id="login-email" placeholder="Sähköposti">
        <input type="password" id="login-password" placeholder="Salasana">
        <button onclick="loginUser()">Kirjaudu sisään</button>
        <button onclick="showView('register-view')" class="btn-secondary">Luo uusi käyttäjä</button>
    </div>

    <div id="register-view" class="view card">
        <h1>Uusi käyttäjä</h1>
        <input type="text" id="reg-name" placeholder="Nimimerkkisi (esim. Matti)">
        <input type="email" id="reg-email" placeholder="Sähköposti">
        <input type="password" id="reg-password" placeholder="Salasana">
        <button onclick="registerUser()">Luo tunnus</button>
        <button onclick="showView('login-view')" class="btn-secondary">Palaa takaisin</button>
    </div>

    <div id="dashboard-view" class="view card">
        <h2>Tervetuloa sisään!</h2>
        <p style="text-align: center;">Olet kirjautunut nimellä: <br><b id="display-name" style="font-size: 20px; color: var(--primary);"></b></p>
        <p style="text-align: center; color: #666;">Sähköpostisi on: <span id="display-email"></span></p>
        
        <button onclick="logoutUser()" style="margin-top: 30px;" class="btn-secondary">Kirjaudu ulos</button>
    </div>

</div>

<script>
    // 1. SUPABASE YHTEYS
    const SUPABASE_URL = 'https://ylfzmklrmfxobvvcqtsh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fTJIHoHxYM9K2jBst4rGOw_Goppt2kt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. NÄKYMIEN VAIHTO
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // 3. TARKISTETAAN ONKO KÄYTTÄJÄ JO SISÄLLÄ (Sivun päivitys)
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            console.log("Käyttäjä löytyi muistista!");
            showDashboard(session.user);
        }
    });

    // 4. REKISTERÖINTI
    async function registerUser() {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        
        if (!name || !email || !password) return alert("Täytä kaikki kentät!");

        console.log("Yritetään luoda tunnus...");
        
        const { data, error } = await supabaseClient.auth.signUp({ 
            email: email, 
            password: password,
            options: { data: { display_name: name } }
        });

        if (error) {
            console.error(error);
            return alert("Virhe: " + error.message);
        }

        alert("Tunnus luotu! Voit nyt kirjautua sisään.");
        showView('login-view');
        
        // Tyhjennetään kentät
        document.getElementById('reg-password').value = "";
    }

    // 5. KIRJAUTUMINEN
    async function loginUser() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        
        if (!email || !password) return alert("Syötä sähköposti ja salasana!");

        console.log("Yritetään kirjautua...");

        const { data, error } = await supabaseClient.auth.signInWithPassword({ 
            email: email, 
            password: password 
        });

        if (error) {
            console.error(error);
            return alert("Virhe: " + error.message);
        }

        console.log("Kirjautuminen onnistui!");
        showDashboard(data.user);
        
        // Tyhjennetään salasanakenttä
        document.getElementById('login-password').value = "";
    }

    // 6. ULOSKIRJAUTUMINEN
    async function logoutUser() {
        console.log("Kirjaudutaan ulos...");
        await supabaseClient.auth.signOut();
        showView('login-view');
    }

    // 7. KOJELAUDAN PÄIVITYS
    function showDashboard(user) {
        showView('dashboard-view');
        
        // Haetaan nimi metadatasta, tai jos sitä ei ole, näytetään 'Nimetön pelaaja'
        const myName = user.user_metadata?.display_name || "Nimetön pelaaja";
        
        document.getElementById('display-name').innerText = myName;
        document.getElementById('display-email').innerText = user.email;
    }

</script>
</body>
</html>
